name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: distributed-banking

jobs:
  build:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: distributed-banking/go.mod
          cache-dependency-path: distributed-banking/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      # The SQLite driver is pure Go, so the whole project builds with no C
      # toolchain. Building with cgo off keeps it that way.
      - name: Build
        env:
          CGO_ENABLED: 0
        run: go build ./...

      - name: Vet
        env:
          CGO_ENABLED: 0
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1
